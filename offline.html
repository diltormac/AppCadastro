<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OS Fácil — Offline</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Inter", system-ui, sans-serif;
        background: #f1f5f9;
        color: #0f172a;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 20px;
        padding: 40px 32px;
        max-width: 420px;
        text-align: center;
        box-shadow: 0 20px 40px -20px rgba(15, 23, 42, 0.2);
      }
      .icon {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: #eef2ff;
        color: #4f46e5;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        font-size: 32px;
      }
      h1 {
        font-size: 20px;
        font-weight: 800;
        margin-bottom: 8px;
      }
      p {
        font-size: 14px;
        color: #64748b;
        line-height: 1.6;
      }
      button {
        margin-top: 24px;
        padding: 10px 20px;
        background: #4f46e5;
        color: white;
        border: none;
        border-radius: 10px;
        font-weight: 700;
        font-size: 13px;
        cursor: pointer;
        transition: background 0.2s;
      }
      button:hover {
        background: #4338ca;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">⚡</div>
      <h1>Você está offline</h1>
      <p>
        O OS Fácil não conseguiu se conectar. Mas não se preocupe: se você já
        abriu o painel antes, os dados carregados continuam disponíveis.
      </p>
      <button onclick="location.reload()">Tentar novamente</button>
    </div>
  </body>
</html>
